# --- SIEM Stream (shared with reference) ---

mimecast.siem.aggregate_id:
  description: Unique identifier that allows you to correlate/group related events.
  name: mimecast.siem.aggregate_id
  type: keyword

mimecast.siem.delivered:
  description: If the email was delivered successfully or not.
  name: mimecast.siem.delivered
  type: boolean

mimecast.siem.delivery_errors:
  description: Information about any errors that occurred on the delivery attempt.
  name: mimecast.siem.delivery_errors
  type: keyword

mimecast.siem.hold_reason:
  description: The reason the email was held for review (quarantined), if applicable.
  name: mimecast.siem.hold_reason
  type: keyword

mimecast.siem.processing_id:
  description: Unique identifier that allows you to correlate/group related events.
  name: mimecast.siem.processing_id
  type: keyword

mimecast.siem.rejection.code:
  description: The rejection code issued if the email was rejected at the receipt stage.
  name: mimecast.siem.rejection.code
  type: number

mimecast.siem.rejection.info:
  description: The rejection information if the email was rejected at the receipt stage.
  name: mimecast.siem.rejection.info
  type: keyword

mimecast.siem.rejection.type:
  description: The rejection type if the email was rejected at the receipt stage.
  name: mimecast.siem.rejection.type
  type: keyword

mimecast.siem.scan_results:
  description: The reason that the click was blocked.
  name: mimecast.siem.scan_results
  type: keyword

mimecast.siem.spam.detection_level:
  description: The detection level defined for the given sender and recipient.
  name: mimecast.siem.spam.detection_level
  type: keyword

mimecast.siem.spam.info:
  description: Information from Mimecast Spam scanners for messages found to be Spam.
  name: mimecast.siem.spam.info
  type: keyword

mimecast.siem.spam.processing_detail:
  description: The Spam processing details for DKIM, SPF, DMARC.
  name: mimecast.siem.spam.processing_detail
  type: object

mimecast.siem.spam.score:
  description: The metric that measures the likelihood of the event being considered spam.
  name: mimecast.siem.spam.score
  type: long

mimecast.siem.subtype:
  description: ''
  name: mimecast.siem.subtype
  type: keyword

mimecast.siem.url_category:
  description: The URL category assigned by Mimecast.
  name: mimecast.siem.url_category
  type: keyword

mimecast.siem.virus_found:
  description: The name of the virus found on the email, if applicable.
  name: mimecast.siem.virus_found
  type: keyword

# --- TTP URL Protection ---

mimecast.ttp.url.scan_result:
  description: The result of the URL scan (e.g. malicious, clean).
  name: mimecast.ttp.url.scan_result
  type: keyword

mimecast.ttp.url.category:
  description: The category assigned to the URL by Mimecast.
  name: mimecast.ttp.url.category
  type: keyword

mimecast.ttp.url.action:
  description: The action taken on the URL click (Block, Allow).
  name: mimecast.ttp.url.action
  type: keyword

mimecast.ttp.url.send_date:
  description: The date the original email containing the URL was sent.
  name: mimecast.ttp.url.send_date
  type: keyword

# --- TTP Attachment Protection ---

mimecast.ttp.attachment.result:
  description: The result of the attachment scan.
  name: mimecast.ttp.attachment.result
  type: keyword

mimecast.ttp.attachment.action_triggered:
  description: The action triggered by the attachment scan result.
  name: mimecast.ttp.attachment.action_triggered
  type: keyword

mimecast.ttp.attachment.definition:
  description: The name of the attachment protection policy definition.
  name: mimecast.ttp.attachment.definition
  type: keyword

# --- TTP Impersonation Protection ---

mimecast.ttp.impersonation.action:
  description: The action taken on the impersonation attempt.
  name: mimecast.ttp.impersonation.action
  type: keyword

mimecast.ttp.impersonation.definition:
  description: The impersonation policy definition that triggered.
  name: mimecast.ttp.impersonation.definition
  type: keyword

mimecast.ttp.impersonation.hits:
  description: The list of impersonation detection reasons.
  name: mimecast.ttp.impersonation.hits
  type: keyword

mimecast.ttp.impersonation.tagged_malicious:
  description: Whether the sender was tagged as malicious.
  name: mimecast.ttp.impersonation.tagged_malicious
  type: boolean

# --- DLP ---

mimecast.dlp.policy:
  description: The name of the DLP policy that was triggered.
  name: mimecast.dlp.policy
  type: keyword

mimecast.dlp.action:
  description: The action taken on the DLP violation.
  name: mimecast.dlp.action
  type: keyword

mimecast.dlp.channel:
  description: The channel through which the DLP event occurred.
  name: mimecast.dlp.channel
  type: keyword

# --- Audit Events ---

mimecast.audit.event_type:
  description: The type of admin audit event.
  name: mimecast.audit.event_type
  type: keyword

mimecast.audit.category:
  description: The audit event category.
  name: mimecast.audit.category
  type: keyword

mimecast.audit.application:
  description: The application context of the audit event.
  name: mimecast.audit.application
  type: keyword

# --- Threat Events (API 2.0) ---

mimecast.threat.type:
  description: The type of threat detected.
  name: mimecast.threat.type
  type: keyword

mimecast.threat.definition:
  description: The threat protection policy definition that triggered.
  name: mimecast.threat.definition
  type: keyword

mimecast.threat.action:
  description: The action taken on the detected threat.
  name: mimecast.threat.action
  type: keyword
