[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "Automation module for Mimecast"
version = "1.0.0"
description = "Sekoia.IO automation module for Mimecast — collects SIEM, TTP, DLP, Threat Intel and Awareness events."
authors = []
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
sekoia-automation-sdk = "^1.22.4"
requests = "^2.31.0"
prometheus-client = "^0.20.0"

[tool.poetry.dev-dependencies]
pytest = "*"
pytest-cov = "*"
requests-mock = "*"

[tool.black]
line-length = 119
target-version = ["py311"]
include = "\\.pyi?$"
exclude = "scripts/"

[tool.isort]
profile = "black"
line_length = 119

[tool.coverage.run]
omit = [
    "tests/*",
    "main.py",
]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [
    "tests",
]
addopts = """
  --strict-markers
  --tb=short
  --cov=mimecast_modules
  --cov-branch
  --cache-clear
  --cov-report=html
  --cov-report=term-missing:skip-covered
  --cov-fail-under=5
  --capture=sys
"""

[tool.mypy]
strict = false
ignore_missing_imports = true
